[project]
name = "guardrail"
version = "0.1.0"
description = "Elder financial fraud watch agent — Strands Agents SDK + Bedrock AgentCore"
requires-python = ">=3.11"
dependencies = [
  "strands-agents",
  "bedrock-agentcore",
  "boto3",
  "pydantic>=2",
  "pydantic-settings",
  "fastapi",
  "uvicorn",
  "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardrail"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
